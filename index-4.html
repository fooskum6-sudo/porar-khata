<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পড়ার খাতা — দৈনিক পড়ার হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FBF7EC;
    --paper-edge: #F3ECDA;
    --ink: #24304A;
    --ink-soft: #566285;
    --rule-blue: #B9CBEA;
    --margin-red: #C1443B;
    --accent-gold: #D6A324;
    --accent-green: #3E7A54;
    --accent-red: #C1443B;
    --accent-soft: #F1E4C9;
    --shadow: 0 18px 40px -20px rgba(36,48,74,0.35);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background: #E7E0CC;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.35), transparent 45%);
    font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif;
    color: var(--ink);
    padding: 32px 16px 64px;
    display:flex;
    justify-content:center;
  }

  .page{
    position:relative;
    width:100%;
    max-width: 880px;
    background:
      repeating-linear-gradient(
        var(--paper) 0px, var(--paper) 37px,
        var(--rule-blue) 37px, var(--rule-blue) 38px
      );
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 46px 40px 40px 66px;
    overflow:hidden;
  }

  .page::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:46px;
    width:2px;
    background: var(--margin-red);
    opacity:0.55;
  }

  .page::after{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:10px;
    background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(36,48,74,0.06) 22px 24px);
  }

  .pin{
    position:absolute;
    top:-14px; left:50%;
    transform: translateX(-50%) rotate(-3deg);
    width:64px; height:26px;
    background: rgba(214,163,36,0.55);
    border: 1px solid rgba(214,163,36,0.7);
    box-shadow: 0 6px 10px rgba(0,0,0,0.12);
  }

  header{
    margin-bottom: 26px;
  }

  .eyebrow{
    font-family: 'Baloo Da 2', 'Noto Sans Bengali', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  h1{
    font-family: 'Baloo Da 2', 'Noto Sans Bengali', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 6px;
    color: var(--ink);
  }

  .sub{
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 52ch;
  }

  /* stats strip */
  .stats{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 26px 0 30px;
  }
  @media (max-width: 620px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
  }

  .stat{
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(36,48,74,0.08);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .stat .label{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .stat .value{
    font-family: 'Baloo Da 2', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
  }

  .stat.good .value{ color: var(--accent-green); }
  .stat.warn .value{ color: var(--accent-gold); }

  /* form */
  form{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    background: rgba(255,255,255,0.55);
    border: 1px dashed rgba(36,48,74,0.25);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 30px;
  }

  .field{
    display:flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label{
    font-size: 12px;
    color: var(--ink-soft);
  }

  .field input{
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid rgba(36,48,74,0.2);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    min-width: 0;
  }
  .field input:focus-visible{
    outline: 2px solid var(--accent-gold);
    outline-offset: 1px;
  }

  #f-subject{ width: 160px; }
  #f-date{ width: 150px; }
  #f-percent{ width: 90px; }

  .btn{
    font-family: 'Baloo Da 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 9px 20px;
    border-radius: 6px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .btn:hover{ background: #384769; }
  .btn:active{ transform: scale(0.97); }
  .btn:focus-visible{ outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  .btn.ghost{
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid rgba(36,48,74,0.25);
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
  }
  .btn.ghost:hover{ color: var(--ink); border-color: var(--ink); }

  /* section title */
  h2{
    font-family: 'Baloo Da 2', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2 .idx{
    color: var(--accent-red);
    font-size:14px;
  }

  /* chart */
  .chart-wrap{
    margin-bottom: 32px;
  }
  .chart{
    display:flex;
    align-items:flex-end;
    gap: 6px;
    height: 130px;
    padding: 4px 2px;
    border-bottom: 1px solid rgba(36,48,74,0.25);
    overflow-x:auto;
  }
  .bar-col{
    flex: 0 0 auto;
    width: 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    justify-content:flex-end;
    height:100%;
  }
  .bar{
    width: 100%;
    border-radius: 3px 3px 0 0;
    background: var(--accent-gold);
    transition: height .4s ease;
  }
  .bar.high{ background: var(--accent-green); }
  .bar.low{ background: var(--accent-red); }
  .bar-col .day-label{
    font-size: 9px;
    color: var(--ink-soft);
    white-space:nowrap;
    transform: rotate(0deg);
  }
  .empty-chart{
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px 0;
  }

  /* table */
  table{
    width:100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th{
    text-align:left;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(36,48,74,0.3);
  }
  tbody tr{
    animation: rise .25s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }
  tbody td{
    padding: 8px 8px;
    vertical-align: middle;
    border-bottom: 1px solid rgba(36,48,74,0.08);
  }
  td.date-cell{ color: var(--ink-soft); white-space:nowrap; font-size:13px; }
  td.subject-cell{ font-family: 'Noto Sans Bengali', sans-serif; }
  .pct-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-family:'Baloo Da 2', sans-serif;
  }
  .pct-track{
    width:70px; height:6px;
    background: rgba(36,48,74,0.12);
    border-radius: 4px;
    overflow:hidden;
  }
  .pct-fill{ height:100%; background: var(--accent-gold); }
  .pct-fill.high{ background: var(--accent-green); }
  .pct-fill.low{ background: var(--accent-red); }

  td.actions{ text-align:right; white-space:nowrap; }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 4px 6px;
  }
  .icon-btn:hover{ color: var(--accent-red); }

  .empty-state{
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 28px 0;
    border: 1px dashed rgba(36,48,74,0.2);
    border-radius: 8px;
  }

  footer{
    margin-top: 28px;
    display:flex;
    justify-content: space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .note{
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  @media (max-width: 560px){
    .page{ padding: 40px 18px 30px 40px; }
    .page::before{ left: 24px; }
    thead th:nth-child(2), td.subject-cell{ display:none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="pin" aria-hidden="true"></div>

  <header>
    <p class="eyebrow">দৈনিক পড়ার হিসাব খাতা</p>
    <h1>পড়ার খাতা 📖</h1>
    <p class="sub">প্রতিদিন কত শতাংশ পড়া শেষ করলে, তা এখানে লিখে রাখো। নিচে নিজের অগ্রগতি একনজরে দেখতে পাবে।</p>
  </header>

  <section class="stats" id="stats">
    <div class="stat">
      <div class="label">মোট এন্ট্রি</div>
      <div class="value" id="stat-total">০</div>
    </div>
    <div class="stat good">
      <div class="label">গড় শতকরা হার</div>
      <div class="value" id="stat-avg">—</div>
    </div>
    <div class="stat">
      <div class="label">সর্বোচ্চ দিন</div>
      <div class="value" id="stat-best">—</div>
    </div>
    <div class="stat warn">
      <div class="label">টানা পড়ার দিন</div>
      <div class="value" id="stat-streak">০</div>
    </div>
  </section>

  <form id="entry-form">
    <div class="field">
      <label for="f-date">তারিখ</label>
      <input type="date" id="f-date" required>
    </div>
    <div class="field">
      <label for="f-subject">বিষয় (ঐচ্ছিক)</label>
      <input type="text" id="f-subject" placeholder="যেমন: গণিত">
    </div>
    <div class="field">
      <label for="f-percent">শতকরা হার (%)</label>
      <input type="number" id="f-percent" min="0" max="100" step="1" required placeholder="০-১০০">
    </div>
    <button type="submit" class="btn">যোগ করো</button>
  </form>

  <div class="chart-wrap">
    <h2><span class="idx">০১</span> সাম্প্রতিক অগ্রগতি</h2>
    <div class="chart" id="chart"></div>
  </div>

  <div class="table-wrap">
    <h2><span class="idx">০২</span> পড়ার তালিকা</h2>
    <div id="table-holder"></div>
  </div>

  <footer>
    <span class="note">ডেটা শুধু এই ব্রাউজারে (localStorage) জমা থাকে।</span>
    <div style="display:flex; gap:8px;">
      <button class="btn ghost" id="export-btn" type="button">এক্সপোর্ট (CSV)</button>
      <button class="btn ghost" id="clear-btn" type="button">সব মুছে ফেলো</button>
    </div>
  </footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'porar-khata-entries';

  /** @typedef {{id:string, date:string, subject:string, percent:number}} Entry */

  /** @returns {Entry[]} */
  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.error('লোড করতে সমস্যা হয়েছে', e);
      return [];
    }
  }

  /** @param {Entry[]} entries */
  function saveEntries(entries){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function fmtDate(iso){
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d)) return iso;
    const days = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
    const months = ['জানু','ফেব্রু','মার্চ','এপ্রি','মে','জুন','জুলা','আগ','সেপ্টে','অক্টো','নভে','ডিসে'];
    return `${d.getDate()} ${months[d.getMonth()]}, ${days[d.getDay()]}`;
  }

  function tone(pct){
    if(pct >= 75) return 'high';
    if(pct < 40) return 'low';
    return '';
  }

  let entries = loadEntries();

  const form = document.getElementById('entry-form');
  const dateInput = document.getElementById('f-date');
  const subjectInput = document.getElementById('f-subject');
  const percentInput = document.getElementById('f-percent');
  const tableHolder = document.getElementById('table-holder');
  const chartEl = document.getElementById('chart');
  const statTotal = document.getElementById('stat-total');
  const statAvg = document.getElementById('stat-avg');
  const statBest = document.getElementById('stat-best');
  const statStreak = document.getElementById('stat-streak');
  const exportBtn = document.getElementById('export-btn');
  const clearBtn = document.getElementById('clear-btn');

  // default date = today
  dateInput.value = new Date().toISOString().slice(0,10);

  function sortedEntries(){
    return [...entries].sort((a,b) => b.date.localeCompare(a.date));
  }

  function render(){
    renderStats();
    renderChart();
    renderTable();
  }

  function renderStats(){
    const total = entries.length;
    statTotal.textContent = total.toLocaleString('bn-BD');

    if(total === 0){
      statAvg.textContent = '—';
      statBest.textContent = '—';
      statStreak.textContent = '০';
      return;
    }

    const avg = entries.reduce((s,e) => s + e.percent, 0) / total;
    statAvg.textContent = avg.toFixed(1).replace('.', ',') + '%';

    const best = sortedEntries().reduce((m,e) => e.percent > m.percent ? e : m, entries[0]);
    statBest.textContent = best.percent + '% (' + fmtDate(best.date) + ')';

    // streak: consecutive days (by date, going backward from most recent) with an entry >= 1 record
    const byDate = new Map(entries.map(e => [e.date, e.percent]));
    let streak = 0;
    let cursor = new Date();
    // if no entry today, start checking from yesterday
    if(!byDate.has(cursor.toISOString().slice(0,10))){
      cursor.setDate(cursor.getDate() - 1);
    }
    while(true){
      const key = cursor.toISOString().slice(0,10);
      if(byDate.has(key)){
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }else{
        break;
      }
    }
    statStreak.textContent = streak.toLocaleString('bn-BD') + ' দিন';
  }

  function renderChart(){
    const recent = sortedEntries().slice(0, 14).reverse();
    chartEl.innerHTML = '';
    if(recent.length === 0){
      chartEl.innerHTML = '<div class="empty-chart">এখনো কোনো এন্ট্রি নেই — নিচের ফর্ম দিয়ে প্রথম এন্ট্রি যোগ করো।</div>';
      return;
    }
    recent.forEach(e => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      const bar = document.createElement('div');
      bar.className = 'bar ' + tone(e.percent);
      bar.style.height = Math.max(4, e.percent) + '%';
      bar.title = fmtDate(e.date) + ': ' + e.percent + '%';
      const label = document.createElement('div');
      label.className = 'day-label';
      const d = new Date(e.date + 'T00:00:00');
      label.textContent = isNaN(d) ? '' : d.getDate();
      col.appendChild(bar);
      col.appendChild(label);
      chartEl.appendChild(col);
    });
  }

  function renderTable(){
    const list = sortedEntries();
    if(list.length === 0){
      tableHolder.innerHTML = '<div class="empty-state">তালিকা খালি। আজকের পড়ার হিসাব যোগ করে শুরু করো।</div>';
      return;
    }

    const rows = list.map(e => `
      <tr data-id="${e.id}">
        <td class="date-cell">${fmtDate(e.date)}</td>
        <td class="subject-cell">${e.subject ? escapeHtml(e.subject) : '<span style="color:var(--ink-soft)">—</span>'}</td>
        <td>
          <div class="pct-pill">
            ${e.percent}%
            <span class="pct-track"><span class="pct-fill ${tone(e.percent)}" style="width:${Math.min(100, Math.max(0,e.percent))}%"></span></span>
          </div>
        </td>
        <td class="actions">
          <button class="icon-btn" data-action="delete" title="মুছে ফেলো">✕</button>
        </td>
      </tr>
    `).join('');

    tableHolder.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>তারিখ</th>
            <th>বিষয়</th>
            <th>শতকরা হার</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    tableHolder.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        const tr = ev.target.closest('tr');
        const id = tr.getAttribute('data-id');
        entries = entries.filter(e => e.id !== id);
        saveEntries(entries);
        render();
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const date = dateInput.value;
    const subject = subjectInput.value.trim();
    const percent = Math.min(100, Math.max(0, Math.round(Number(percentInput.value))));

    if(!date || isNaN(percent)){
      return;
    }

    // if an entry already exists for this exact date + subject combo, update it instead of duplicating
    const existing = entries.find(e => e.date === date && (e.subject || '') === subject);
    if(existing){
      existing.percent = percent;
    }else{
      entries.push({ id: uid(), date, subject, percent });
    }

    saveEntries(entries);
    render();

    percentInput.value = '';
    subjectInput.value = '';
    percentInput.focus();
  });

  clearBtn.addEventListener('click', () => {
    if(entries.length === 0) return;
    const ok = confirm('সত্যিই সব এন্ট্রি মুছে ফেলতে চাও? এই কাজটি ফেরানো যাবে না।');
    if(ok){
      entries = [];
      saveEntries(entries);
      render();
    }
  });

  exportBtn.addEventListener('click', () => {
    if(entries.length === 0){
      alert('এক্সপোর্ট করার মতো কোনো ডেটা নেই।');
      return;
    }
    const header = 'তারিখ,বিষয়,শতকরা হার\n';
    const rows = sortedEntries().map(e => `${e.date},${(e.subject || '').replace(/,/g,' ')},${e.percent}`).join('\n');
    const csv = '\uFEFF' + header + rows;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'porar-khata.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  render();
})();
</script>

</body>
</html>
